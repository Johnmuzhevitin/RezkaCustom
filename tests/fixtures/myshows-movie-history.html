<!-- Native MyShows history structure observed 2026-11-02; all record data is synthetic. -->
<div class="ScrobbleCard">
  <div class="ScrobbleCard__row">
    <div class="ScrobbleCard__poster-wrapper">
      <a class="MovieCard ScrobbleCard__entity" href="/movie/456/">Example movie</a>
    </div>
    <div class="ScrobbleCard__info">
      <div class="ScrobbleCard__header">
        <div class="ScrobbleCard__status ScrobbleCard__status--pending">Ожидает</div>
        <div class="ScrobbleCard__source">{{source}}</div>
        <div class="ScrobbleCard__controls"><button aria-label="Отклонить">×</button></div>
      </div>
      <div class="ScrobbleCard__title">Example movie<span class="ScrobbleCard__year"> (2020)</span></div>
      <div class="ScrobbleCard__original-title"><span>Original movie</span></div>
      <div class="ScrobbleCard__footer">
        <div class="ScrobbleCard__progress-wrapper"><div class="ScrobbleCard__progress-value">100%</div></div>
        <div class="ScrobbleCard__actions">
          <button class="Button Button--bordered-blue xs" type="button">Сопоставить</button>
          <button class="Button Button--primary xs" type="button">Подтвердить</button>
        </div>
      </div>
    </div>
  </div>
</div>
