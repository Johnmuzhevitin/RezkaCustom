name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Run the supplementary disposable Chromium suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check:browser
