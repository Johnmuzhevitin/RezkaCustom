<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки Rezka Custom</title>
  <link rel="stylesheet" href="popup.css">
  <script src="build-info.js" defer></script>
  <script src="network-policy.js" defer></script>
  <script src="settings-schema.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="view" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="player" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7zM4 5v14"/></symbol>
    <symbol id="hide" viewBox="0 0 24 24"><path d="m3 3 18 18M10.5 10.5a2 2 0 0 0 3 3M9 5.4A11 11 0 0 1 12 5c7 0 10 7 10 7a16 16 0 0 1-3 4M6 6a18 18 0 0 0-4 6s3 7 10 7a11 11 0 0 0 4-.7"/></symbol>
    <symbol id="filter" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .7-1.5 1-1.5 2m0 3v.1"/></symbol>
  </defs></svg>
  <div class="shell">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 5h9a7 7 0 0 1 0 14H9v5H5V5Zm4 4v6h5a3 3 0 0 0 0-6H9Z"/><path d="m16 17 7 7h-6l-6-7Z"/></svg></span><span>Rezka <strong>Custom</strong></span></div>
      <button id="help-button" class="icon-button" aria-label="Открыть справку" title="Справка"><svg><use href="#help"/></svg></button>
    </header>
    <div class="site-line"><span id="site-dot" class="site-dot"></span><span id="site-label">Подключаемся к странице…</span></div>
    <div class="search-box"><svg aria-hidden="true"><use href="#search"/></svg><input id="search-input" type="search" placeholder="Найти настройку" aria-label="Найти настройку" aria-controls="content" aria-keyshortcuts="Control+f Meta+f" autocomplete="off"><kbd aria-hidden="true" id="search-shortcut">Ctrl F</kbd></div>
    <nav class="tabs" aria-label="Разделы настроек" role="tablist">
      <button id="tab-view" role="tab" aria-selected="true" aria-controls="content" data-section="view"><svg aria-hidden="true"><use href="#view"/></svg>Вид</button>
      <button id="tab-player" role="tab" aria-selected="false" aria-controls="content" data-section="player" tabindex="-1"><svg aria-hidden="true"><use href="#player"/></svg>Плеер</button>
      <button id="tab-hide" role="tab" aria-selected="false" aria-controls="content" data-section="hide" tabindex="-1"><svg aria-hidden="true"><use href="#hide"/></svg>Скрытие</button>
      <button id="tab-filter" role="tab" aria-selected="false" aria-controls="content" data-section="filter" tabindex="-1"><svg aria-hidden="true"><use href="#filter"/></svg>Фильтр</button>
    </nav>
    <main id="content" class="content" role="tabpanel" aria-labelledby="tab-view" tabindex="0" aria-busy="true"><p class="loading">Загружаем настройки…</p></main>
    <span id="search-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
    <span id="notice-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
    <div id="notice" class="notice" hidden><span id="notice-text"></span><button id="reload-button" type="button" hidden>Обновить страницу</button></div>
    <footer class="footer"><span id="save-status" role="status" aria-live="polite" aria-atomic="true"><svg aria-hidden="true"><use href="#check"/></svg><span>Изменения сохраняются сразу</span></span><span id="version"></span></footer>
  </div>
</body>
</html>
